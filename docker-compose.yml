# Demo stack: a Traefik reverse proxy in front of a static front-end and a
# JSON API.
#
#   http://localhost:8000/           -> web      (nginx, static page in ./web)
#   http://localhost:8000/api/...    -> backend  (python JSON API, built from ./api)
#   http://localhost:8080/           -> Traefik dashboard (insecure, local only)
#
# Traefik discovers routes from each container's `traefik.*` labels through
# the Podman API socket that the Nix dev shell exposes as $DOCKER_SOCK.
# `just up` builds the web + backend images on first run; after editing the
# ./web or ./api folder run `just rm; just up` to force a clean rebuild
# (podman-compose's `--build` often misses a changed COPY).

services:
  proxy:
    image: docker.io/library/traefik:v3.3
    command:
      - --providers.docker=true
      - --providers.docker.endpoint=unix:///var/run/docker.sock
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --api.dashboard=true
      - --api.insecure=true        # dashboard on :8080 with no auth -- dev only
      - --accesslog=true
    ports:
      - "${PROXY_PORT:-8000}:80"
      - "${PROXY_DASHBOARD_PORT:-8080}:8080"
    volumes:
      - "${DOCKER_SOCK:-/var/run/docker.sock}:/var/run/docker.sock:ro"
    restart: unless-stopped

  web:
    build:
      context: ./web
    labels:
      - traefik.enable=true
      - traefik.http.routers.web.rule=PathPrefix(`/`)
      - traefik.http.routers.web.priority=1        # catch-all: lowest priority
      - traefik.http.services.web.loadbalancer.server.port=80
    restart: unless-stopped

  backend:
    build:
      context: ./api
    environment:
      PORT: "8000"
    labels:
      # router/service name is `backend`, not `api` -- `api` is reserved by
      # Traefik's own dashboard router (`--api.insecure`).
      - traefik.enable=true
      - traefik.http.routers.backend.rule=PathPrefix(`/api`)
      - traefik.http.routers.backend.middlewares=backend-strip
      - traefik.http.middlewares.backend-strip.stripprefix.prefixes=/api
      - traefik.http.services.backend.loadbalancer.server.port=8000
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')\""]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
