# Demo stack: a Traefik reverse proxy in front of a static front-end and a
# JSON API.
#
#   http://localhost:8000/           -> web      (nginx, static page in ./web)
#   http://localhost:8000/api/...    -> backend  (python JSON API, built from ./api)
#   http://localhost:8080/           -> Traefik dashboard (insecure, local only)
#
# Traefik discovers routes from each container's `traefik.*` labels through
# the Podman API socket that the Nix dev shell exposes as $DOCKER_SOCK.
#
# This file is for local development: web and backend build from their
# Dev.Dockerfile and bind-mount their source, so edits apply without a
# rebuild. Release images build from each folder's Dockerfile. After changing
# a Dev.Dockerfile, run `just rebuild <service>` (podman-compose's `--build`
# often misses a change). Healthchecks poll every second so `up --wait` and
# `depends_on` return as soon as a service is ready.

services:
  proxy:
    image: docker.io/library/traefik:v3.7
    command:
      - --providers.docker=true
      - --providers.docker.endpoint=unix:///var/run/docker.sock
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --api.dashboard=true
      - --api.insecure=true        # dashboard on :8080 with no auth -- dev only
      - --accesslog=true
      - --ping=true                 # /ping on the dashboard's `traefik` entrypoint, for the healthcheck
    # Published on 127.0.0.1 only: without an address, Docker and Podman
    # publish on every interface, which on a server exposes the stack -- and
    # the unauthenticated dashboard -- to the network. Set PROXY_BIND=0.0.0.0
    # to share the app on the LAN; the dashboard stays local.
    ports:
      - "${PROXY_BIND:-127.0.0.1}:${PROXY_PORT:-8000}:80"
      - "127.0.0.1:${PROXY_DASHBOARD_PORT:-8080}:8080"
    volumes:
      - "${DOCKER_SOCK:-/var/run/docker.sock}:/var/run/docker.sock:ro"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 1s
      timeout: 1s
      retries: 10
      start_period: 1s

  web:
    build:
      context: ./web
      dockerfile: Dev.Dockerfile
    volumes:
      - ./web:/usr/share/nginx/html:ro,z
    depends_on:
      proxy:
        condition: service_started
    labels:
      - traefik.enable=true
      - traefik.http.routers.web.rule=PathPrefix(`/`)
      - traefik.http.routers.web.priority=1        # catch-all: lowest priority
      - traefik.http.services.web.loadbalancer.server.port=80
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 1s
      timeout: 1s
      retries: 10
      start_period: 1s

  backend:
    build:
      context: ./api
      dockerfile: Dev.Dockerfile
    volumes:
      - ./api:/app:ro,z
    depends_on:
      proxy:
        condition: service_started
    environment:
      PORT: "8000"
    labels:
      # router/service name is `backend`, not `api` -- `api` is reserved by
      # Traefik's own dashboard router (`--api.insecure`).
      - traefik.enable=true
      - traefik.http.routers.backend.rule=PathPrefix(`/api`)
      - traefik.http.routers.backend.middlewares=backend-strip
      - traefik.http.middlewares.backend-strip.stripprefix.prefixes=/api
      - traefik.http.services.backend.loadbalancer.server.port=8000
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')\""]
      interval: 1s
      timeout: 1s
      retries: 10
      start_period: 1s
