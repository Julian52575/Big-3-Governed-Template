name: setup-devshell
description: >
  Install Nix and warm this repo's dev shell, so later steps can call
  `nix develop --command ...` cheaply. Shared setup for every workflow that
  needs the toolbox.

  The caller MUST run actions/checkout before this action -- a composite
  action referenced by local path (./.github/actions/...) cannot check out
  the repository it lives in.

inputs:
  warm:
    description: Evaluate the flake and build the dev shell now, so later steps hit a warm store.
    default: "true"

runs:
  using: composite
  steps:
    - name: Install Nix
      uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

    # Caches this repo's Nix store paths in the GitHub Actions cache (no
    # external account/secret needed -- works out of the box for anyone who
    # clones this template). Restores here, saves automatically at job end.
    # Most packages in this flake also come pre-built from cache.nixos.org;
    # this mainly helps once the flake grows its own derivations, and saves
    # re-downloading on every run. See the README for the Cachix upgrade path.
    - name: Cache the Nix store
      uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
      with:
        primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.nix', 'flake.lock') }}
        restore-prefixes-first-match: nix-${{ runner.os }}-
        gc-max-store-size-linux: 1073741824 # 1 GiB, keep under GitHub's 10 GB/repo cache cap
        purge: true
        purge-prefixes: nix-${{ runner.os }}-
        purge-created: 0
        purge-primary-key: never

    - name: Warm the dev shell
      if: inputs.warm == 'true'
      shell: bash
      run: nix develop --command true
