name: ci-sast

# Static Application Security Testing. Opt-in pieces switch on by secret:
#
#   guard            decides what runs: nothing on a draft or fork PR; SonarQube
#                    only when SONARQUBE_TOKEN is set; report commits only when
#                    SAST_REPORT_TOKEN is set. Skipped tools no-op to green.
#   codeql           always on. Builds .sast/report/codeql/ from the SARIF and
#                    fails on any error-severity alert. Nothing is uploaded to
#                    code scanning, so no Advanced Security is needed.
#   sonarqube        SonarQube Cloud scan + Quality Gate (.sast/report/sonarqube/).
#   commit-reports   push to main only: commits every report to main in one
#                    `[skip ci]` commit, pushed with SAST_REPORT_TOKEN so a
#                    protected main accepts it.
#   ci-sast-required single stable check to add to the branch ruleset once the
#                    team relies on it.
#
# Per-tool config and setup: .sast/README.md.

on:
  push:
    branches: [main]
    paths-ignore:
      - "*.md"
      - ".gitignore"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/rulesets/**"
      - ".sast/report/**" # commit-reports' own commits; belt and braces with [skip ci]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

# Never cancel a push-to-main run: it would drop that commit's report.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.check.outputs.run }}
      sonar: ${{ steps.check.outputs.sonar }}
      commit: ${{ steps.check.outputs.commit }}
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - id: check
        env:
          IS_FORK: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
          IS_DRAFT: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft }}
          HAS_SONAR: ${{ secrets.SONARQUBE_TOKEN != '' }}
          HAS_REPORT_TOKEN: ${{ secrets.SAST_REPORT_TOKEN != '' }}
        run: |
          run=true sonar=true commit=true
          if [[ $IS_FORK == true ]]; then
            run=false; echo "Fork pull request -- secrets are not exposed, SAST skipped."
          elif [[ $IS_DRAFT == true ]]; then
            run=false; echo "Draft pull request -- SAST runs once the PR is marked ready."
          fi
          if [[ $HAS_SONAR != true ]]; then
            sonar=false; echo "SONARQUBE_TOKEN not set -- SonarQube skipped (see .sast/README.md)."
          fi
          if [[ $HAS_REPORT_TOKEN != true ]]; then
            commit=false; echo "SAST_REPORT_TOKEN not set -- reports are not committed to main."
          fi
          { echo "run=$run"; echo "sonar=$sonar"; echo "commit=$commit"; } >> "$GITHUB_OUTPUT"

  codeql:
    name: CodeQL
    needs: [guard]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        if: needs.guard.outputs.run == 'true'
        with:
          egress-policy: audit

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: needs.guard.outputs.run == 'true'
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        if: needs.guard.outputs.run == 'true'
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          # CUSTOMISE: add your languages, e.g. `actions, python, javascript-typescript`.
          # `actions` (the workflows themselves) is always valid here.
          languages: actions
          build-mode: none
          config-file: .sast/codeql-config.yml

      - name: Analyze
        if: needs.guard.outputs.run == 'true'
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          # SARIF lands here for codeql-report.sh; set `upload: always` (and
          # `security-events: write`) to also publish to the Security tab.
          output: .sast/codeql-results
          upload: never

      - name: Build the report
        id: report
        if: needs.guard.outputs.run == 'true'
        env:
          SARIF_DIR: .sast/codeql-results
          CODEQL_SCOPE: >-
            ${{ github.event_name == 'pull_request'
                && format('pullRequest={0}', github.event.pull_request.number)
                || format('branch={0}', github.ref_name) }}
        run: bash .sast/bin/codeql-report.sh

      - name: Stash the report for commit-reports
        if: always() && needs.guard.outputs.run == 'true' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sast-report-codeql
          path: .sast/report/codeql
          retention-days: 1
          if-no-files-found: ignore

      - name: Enforce the gate
        if: needs.guard.outputs.run == 'true' && steps.report.outputs.gate == 'failed'
        run: |
          echo "::error::CodeQL found error-severity alerts -- see the job summary"
          exit 1

  sonarqube:
    name: SonarQube Cloud
    needs: [guard]
    if: needs.guard.outputs.run == 'true' && needs.guard.outputs.sonar == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The branch head, not the PR merge ref; full history for new-code
          # and blame data.
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
          persist-credentials: false

      # CUSTOMISE: generate coverage here (SonarQube only imports reports) and
      # point sonar-project.properties at them, or the new-code coverage
      # condition reports 0%.

      - name: SonarQube scan
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONARQUBE_TOKEN }}
        with:
          args: -Dproject.settings=.sast/sonar-project.properties

      - name: Build the report
        id: report
        env:
          SONAR_TOKEN: ${{ secrets.SONARQUBE_TOKEN }}
          SONAR_SCOPE: >-
            ${{ github.event_name == 'pull_request'
                && format('pullRequest={0}', github.event.pull_request.number)
                || format('branch={0}', github.ref_name) }}
        run: bash .sast/bin/sonar-report.sh

      - name: Stash the report for commit-reports
        if: always() && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sast-report-sonarqube
          path: .sast/report/sonarqube
          retention-days: 1
          if-no-files-found: ignore

      - name: Enforce the Quality Gate
        if: steps.report.outputs.gate == 'failed'
        run: |
          echo "::error::SonarQube Quality Gate failed -- see the job summary"
          exit 1

  # Runs even if a tool job failed, so a red report still lands on main.
  commit-reports:
    name: Commit SAST reports
    needs: [guard, codeql, sonarqube]
    if: >-
      always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
      && needs.guard.outputs.run == 'true' && needs.guard.outputs.commit == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Collect tool reports
        continue-on-error: true # nothing to collect if every tool job crashed early
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: sast-report-*
          path: .sast/report

      - name: Lay reports out under .sast/report/<tool>/
        run: |
          shopt -s nullglob
          for d in .sast/report/sast-report-*/; do
            tool=${d#.sast/report/sast-report-}; tool=${tool%/}
            rm -rf ".sast/report/${tool}"
            mv "$d" ".sast/report/${tool}"
          done

      # SAST_REPORT_TOKEN (PAT, Contents: write) is set only for this step and
      # never written to .git/config. [skip ci] plus the .sast/report/**
      # paths-ignore stop the push from starting another run.
      - name: Commit the refreshed reports to main
        env:
          SAST_REPORT_TOKEN: ${{ secrets.SAST_REPORT_TOKEN }}
        run: |
          remote="https://x-access-token:${SAST_REPORT_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .sast/report
          if git diff --cached --quiet; then
            echo "SAST reports unchanged."
            exit 0
          fi
          git commit -m "ci(sast): refresh SAST reports [skip ci]"
          for attempt in 1 2 3; do
            git push "$remote" HEAD:main && exit 0
            echo "push rejected (attempt ${attempt}); rebasing onto main"
            git pull --rebase --autostash "$remote" main || break
          done
          echo "::warning::could not push the refreshed SAST reports; they will refresh on the next push to main"

  # Passes when every needed job succeeded or was skipped (opt-in tools,
  # commit-reports on PRs); fails on failure/cancelled.
  ci-sast-required:
    if: always()
    needs: [guard, codeql, sonarqube, commit-reports]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Every required job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          if printf '%s\n' "$RESULTS" | grep -Eqw 'failure|cancelled'; then
            echo "a required job did not succeed: $RESULTS"
            exit 1
          fi
