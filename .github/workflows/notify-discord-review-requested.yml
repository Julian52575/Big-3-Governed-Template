name: notify-discord-review-requested

# Opt-in (repo variable DISCORD_NOTIFY=true + secret DISCORD_WEBHOOK_URL).
# Discord's /github webhook endpoint ignores review_requested, so post it ourselves.

on:
  pull_request:
    types: [review_requested]

permissions: {}

jobs:
  notify:
    if: vars.DISCORD_NOTIFY == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Post to Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          SENDER: ${{ github.event.sender.login }}
          REVIEWER: ${{ github.event.requested_reviewer.login || github.event.requested_team.name }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "::warning::DISCORD_NOTIFY is on but DISCORD_WEBHOOK_URL is not set (fork PRs never get it)"
            exit 0
          fi
          jq -n \
            --arg title "#$PR_NUMBER $PR_TITLE" \
            --arg url "$PR_URL" \
            --arg desc "$SENDER requested a review from $REVIEWER" \
            '{embeds: [{title: $title, url: $url, description: $desc, color: 15105570}], allowed_mentions: {parse: []}}' \
          | curl -fsS -X POST -H 'Content-Type: application/json' --data-binary @- "$DISCORD_WEBHOOK_URL"
