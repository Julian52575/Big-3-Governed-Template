name: release-to-ghcr

# Builds every image listed in the matrix, pushes it to GHCR with an SBOM and
# signs it keyless with cosign (Sigstore OIDC, no key to manage).
#
#   release created     -> :<tag> and :latest
#   workflow_dispatch   -> :<input tag> only (never touches :latest)
#
# Image: ghcr.io/<owner>/<repo>-<matrix.image>, lower-cased.
# Verify: cosign verify ghcr.io/<owner>/<repo>-backend:<tag> \
#   --certificate-identity-regexp 'https://github.com/<owner>/<repo>/' \
#   --certificate-oidc-issuer https://token.actions.githubusercontent.com

on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag for this manual/test build (never touches :latest or release tags)"
        required: true
        default: manual-test

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      id-token: write # cosign keyless (OIDC) signing
    strategy:
      fail-fast: true
      matrix:
        # CUSTOMISE: one entry per image; `context` is its build directory.
        include:
          - image: backend
            context: backend
          - image: frontend
            context: frontend
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compute the image name
        env:
          IMAGE_SUFFIX: ${{ matrix.image }}
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}-${IMAGE_SUFFIX}" >> "$GITHUB_ENV"

      - name: Log in to the Container registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=tag,enable=${{ github.event_name == 'release' }}
            type=raw,value=latest,enable=${{ github.event_name == 'release' }}
            type=raw,value=${{ inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' }}
          labels: |
            org.opencontainers.image.description=${{ github.event.repository.name }} ${{ matrix.image }} image

      - name: Build and push the image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign the image (keyless)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
