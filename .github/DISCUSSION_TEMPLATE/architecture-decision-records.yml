body:
  - type: markdown
    attributes:
      value: |
        ---
        💡 **If this is a Superseded document, you can use the previous ADR name as Title. ADRs will have a github #number.**

  - type: input
    id: date
    attributes:
      label: Date
      description: Date when the ADR was created.
      placeholder: YYYY-MM-DD
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Context
      description: What situation requires a decision?
      placeholder: Builds take 20 minutes; a proposal was made to add a remote build cache.
    validations:
      required: true

  - type: textarea
    id: interrogations
    attributes:
      label: Questions
      description: What questions need answering? What should be looked into further?
      placeholder: |
        - Which build steps dominate the time?
        - Look into self-hosted vs managed caches.
    validations:
      required: false

  - type: textarea
    id: options
    attributes:
      label: Options
      description: What are our options?
      placeholder: |
        1. Keep the current setup and optimise the slowest steps
        2. Add a managed remote cache
        3. Self-host a cache
    validations:
      required: true

  - type: dropdown
    id: decision
    attributes:
      label: Decision
      options:
        - Proposed
        - Accepted
        - Rejected
        - Superseded
      default: 0
    validations:
      required: true

  - type: input
    id: branch
    attributes:
      label: Branch
      description: Branch to commit the ADR document to once this decision is Accepted and the discussion is closed. Leave empty until ready -- the discussion will be reopened and you'll be asked to fill it in if it's missing.
      placeholder: main
    validations:
      required: false

  - type: textarea
    id: justification
    attributes:
      label: Justification
      description: Why was this decision taken?
    validations:
      required: false

  - type: textarea
    id: consequences-upside
    attributes:
      label: Consequences -- Upside
      description: What are the expected benefits?
      placeholder: Builds under 5 minutes.
    validations:
      required: false

  - type: textarea
    id: consequences-tradeoff
    attributes:
      label: Consequences -- Trade-offs and risks
      description: What are the expected consequences, trade-offs, or risks?
      placeholder: A new external service to maintain and pay for.
    validations:
      required: false

  - type: dropdown
    id: impact_size
    attributes:
      label: Impact size
      description: Impact on the project as it is in the current state of main.
      options:
        - Tiny -- minutes
        - Small -- hours
        - Medium -- days
        - Large -- weeks, needs breaking down
    validations:
      required: true

  - type: textarea
    id: references
    attributes:
      label: References
      description: Add relevant issues, pull requests, documentation, benchmarks, or external resources.
      placeholder: |
        - Issue #123
        - https://example.com/...
    validations:
      required: false

  - type: markdown
    attributes:
      value: |
        ---
        💡 **Once the decision has been implemented, please come back and leave a final comment summarizing the outcome and close the discussion.
        Make sure to include a branch to commit the document.**
