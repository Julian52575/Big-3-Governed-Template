name: Debt
description: It works, but the design or code carries technical debt that should be paid down
title: "[Debt] "
labels: ["debt", "needs-triage"]
body:
  - type: checkboxes
    attributes:
      label: Pre-submit
      options:
        - label: I searched open and closed issues and this is not a duplicate
          required: true

  - type: textarea
    attributes:
      label: The shortcut
      description: What was done the quick way, and where in the codebase it lives.
    validations:
      required: true

  - type: textarea
    attributes:
      label: Cost it carries
      description: What this makes slower, riskier, or harder to change today -- and what it will cost if left alone.
    validations:
      required: true

  - type: textarea
    attributes:
      label: Proposed cleanup
      description: The shape of the fix, if you have one in mind.
    validations:
      required: false

  - type: dropdown
    attributes:
      label: Interest accrual
      description: How fast is this getting worse?
      options:
        - Low -- stable; annoying but not spreading
        - Medium -- slows work in this area
        - High -- actively blocking, or spreading into new code
    validations:
      required: false
