# SonarQube Cloud analysis settings, loaded by .github/workflows/ci-sast.yml
# (-Dproject.settings=.sast/sonar-project.properties). Paths are relative to
# the repo root. Reference:
#   https://docs.sonarsource.com/sonarqube-cloud/advanced-setup/analysis-parameters/

# --- Project identity ----------------------------------------------------
# From the SonarQube Cloud project setup screen. Fill in before setting the
# SONARQUBE_TOKEN secret -- the job is skipped until that secret exists.
sonar.organization=REPLACE_WITH_ORGANIZATION_KEY
sonar.projectKey=REPLACE_WITH_PROJECT_KEY

# --- What to analyse -----------------------------------------------------
# CUSTOMISE: your source and test roots.
sonar.sources=api,web
# sonar.tests=api/tests
sonar.exclusions=**/*.min.js,**/*.min.css,**/dist/**,.sast/**

# --- Coverage ------------------------------------------------------------
# SonarQube only imports reports; generate them in the sonarqube job of
# ci-sast.yml (CUSTOMISE marker) and point at them here, e.g.
# sonar.javascript.lcov.reportPaths=web/coverage/lcov.info
# sonar.python.coverage.reportPaths=api/coverage.xml

sonar.sourceEncoding=UTF-8
